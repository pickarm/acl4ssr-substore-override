name: Sync ACL4SSR upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths:
      - 'scripts/generate.mjs'
      - 'scripts/sing-box.mjs'
      - '.github/workflows/sync-upstream.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate.mjs'
      - 'scripts/sing-box.mjs'
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: sync-acl4ssr-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Mihomo output and mirror rulesets
        run: node scripts/generate.mjs

      - name: Validate Mihomo VLESS UDP-over-TCP
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('dist/acl4ssr-full.js', 'utf8');
          if (text.includes('AND,((NETWORK,UDP),(DST-PORT,443)),REJECT')) {
            throw new Error('Generated Mihomo output must not globally reject UDP/443');
          }
          if (!text.includes('function normalizeVlessProxy(proxy)')) {
            throw new Error('Missing VLESS UDP normalizer');
          }
          if (!text.includes("udp: true, 'packet-encoding': 'xudp'")) {
            throw new Error('VLESS nodes are not forced to UDP + XUDP');
          }

          const vm = require('node:vm');
          const sandbox = {};
          vm.runInNewContext(text, sandbox);
          const out = sandbox.main({
            proxies: [
              { name: 'US Detail Node', type: 'vless', server: '1.1.1.1', port: 443 },
              { name: 'HK Detail Node', type: 'vless', server: '2.2.2.2', port: 443 }
            ]
          });
          const ai = out['proxy-groups'].find((g) => /Ai平台|AI平台/.test(g.name));
          if (!ai || !ai.proxies.includes('US Detail Node') || !ai.proxies.includes('HK Detail Node')) {
            throw new Error('AI select group does not expose actual node names directly');
          }
          const ad = out['proxy-groups'].find((g) => g.name === '🛑 广告拦截');
          if (ad && (ad.proxies.includes('US Detail Node') || ad.proxies.includes('HK Detail Node'))) {
            throw new Error('Ad helper group must not expose arbitrary actual nodes');
          }
          NODE

      - name: Generate sing-box AI source rule-set
        run: node scripts/sing-box.mjs

      - name: Compile sing-box AI binary rule-set
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/sagernet/sing-box:v1.14.0 \
            rule-set compile --output dist/sing-box/ai.srs dist/sing-box/ai.json
          test -s dist/sing-box/ai.srs

      - name: Show changes
        run: git diff --stat

      - name: Commit generated changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- dist/ upstream/ upstream.json rulesets/; then
            echo 'No upstream/generated changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/ upstream/ upstream.json rulesets/
          git commit -m 'chore: sync ACL4SSR upstream and regenerate outputs'

          # The branch can move while a scheduled/manual run is executing.
          # Rebase the generated commit before pushing instead of failing with
          # a non-fast-forward error. Concurrency above also serializes runs.
          git pull --rebase origin main
          git push origin HEAD:main
