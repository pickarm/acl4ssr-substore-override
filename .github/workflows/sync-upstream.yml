name: Sync ACL4SSR upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate.mjs'
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate override and mirror rulesets
        run: node scripts/generate.mjs

      - name: Show changes
        run: git diff --stat && git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- dist/ upstream/ upstream.json rulesets/; then
            echo 'No upstream/generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/ upstream/ upstream.json rulesets/
          git commit -m 'chore: sync ACL4SSR upstream and rulesets'
          git push
